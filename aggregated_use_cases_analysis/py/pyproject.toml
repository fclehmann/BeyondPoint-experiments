[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aggregated-use-cases-analysis"
version = "0.0.1"
description = ""
authors = ["Yahor Paromau"]
packages = [{ include = "aggregated_use_cases_analysis", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
numpy = "~1.23.0"
pandas = "~1.4.0"
matplotlib = "^3.7.1"
seaborn = "^0.12.2"
jupyter = "^1.0.0"
plotly = "^5.14.1"
scipy = "^1.10.1"
tomlkit = "^0.11.8"
experiment_runner = { path = "../../tools/experiment_runner", develop = true }
hydra-core = "^1.3.2"
hydra-submitit-launcher = {git = "https://github.com/facebookresearch/hydra.git", rev = "v1.3.2", subdirectory = "plugins/hydra_submitit_launcher"}
hydra-joblib-launcher = "^1.2.0"
tqdm = "^4.66.1"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
metadata = true
dirty = true