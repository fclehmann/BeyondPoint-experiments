global_settings:
  q_levels:                [0.95, 0.9, 0.75, 0.5, 0.25, 0.1, 0.05]
  q_type:                  1
  seeds:                   1
  boot_percentiles_levels: [0.025, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.975]

distributions:
  - name: norm_validation
    type: norm
    params:
      mean: 0.87
      sd: 0.042
    theo_mean: 0.87

  - name: beta_left_skewed_validation
    type: beta
    params:
      shape1: 20
      shape2: 3
    theo_mean: 20/23

variations:
  - id:              1
    sample_size:     10
    num_samples:     50
    num_bootsamples: 50

  - id:              2
    sample_size:     15
    num_samples:     50
    num_bootsamples: 50

