global_settings:
  root_dir: "/home/clehm/uncertainty-in-ml/" 
  q_levels: [0.95, 0.9, 0.75, 0.5, 0.25, 0.1, 0.05]
  q_type: 1
  seeds: 1
  boot_percentiles_levels: [0.025, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.975]

distributions:
  - name: norm_validation
    type: norm
    params:
      mean: 0.87
      sd: 0.042
    theo_mean: 0.87

  - name: beta_left_skewed_validation
    type: beta
    params:
      shape1: 20
      shape2: 3
    theo_mean: 20/23

  - name: beta_right_skewed_validation
    type: beta
    params:
      shape1: 3
      shape2: 20
    theo_mean: 3/23

  - name: gumbel_validation
    type: gumbel
    params:
      loc: 10
      scale: 0.07
    theo_mean: 10.0404

  - name: normal_mixture
    type: mixnorm
    params:
      mean: [0.8, 0.9]
      sd: [0.03, 0.02]
      pro: [0.5, 0.5]
    theo_mean: 0.85

variations:
  - id: 1
    sample_size: 10
    num_samples: 2000
    num_bootsamples: 2000

  - id: 2
    sample_size: 15
    num_samples: 2000
    num_bootsamples: 2000

  - id: 3
    sample_size: 25
    num_samples: 2000
    num_bootsamples: 2000

  - id: 4
    sample_size: 50
    num_samples: 2000
    num_bootsamples: 2000

