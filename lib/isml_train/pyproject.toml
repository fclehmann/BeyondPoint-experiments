[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "isml-train"
version = "0.0.1"
description = ""
readme = "README.md"
authors = ["Yahor Paromau"]
packages = [{ include = "isml_train" }]

[tool.poetry.dependencies]
python = "^3.9"
scikit-learn = "~1.1.0"
numpy = "~1.23.0"
pandas = "^1.4.0"
lightning = "^2.3.3"
torch = { version = "^2.1.2" }
torchvision = { version = "^0.16.2" }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
metadata = true
dirty = true
