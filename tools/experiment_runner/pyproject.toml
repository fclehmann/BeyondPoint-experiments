[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "experiment-runner"
version = "0.0.0"
description = ""
readme = "README.md"
authors = ["Yahor Paromau"]
packages = [{ include = "experiment_runner" }]

[tool.poetry.dependencies]
python = "^3.9"
fabric = "~2.7.1"
Jinja2 = "~3.1.2"
tomlkit = "^0.13.2"
pandas = "^2.2.3"
typer = { version = "~0.9.0", extras = ["all"] }
pydantic = { version = "^1.10.5" }
rich = "^13.7.1"
tqdm = "^4.66.5"
redis = "^5.2.0"
optuna = "^4.0.0"
submitit = "^1.5.2"
pyyaml = "^6.0.2"
setuptools = "^75.2.0"
filelock = "^3.16.1"
psycopg2-binary = "^2.9.10"
retry = "^0.9.2"
seaborn = "^0.13.2"
matplotlib = "^3.9.2"
joblib = "^1.4.2"


[tool.poetry.scripts]
experiment-runner = "experiment_runner.cli:app"

