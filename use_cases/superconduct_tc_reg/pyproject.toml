[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "superconduct-tc-reg"
version = "0.0.0"
description = ""
readme = "README.md"
authors = ["Yahor Paromau"]
packages = [{ include = "superconduct_tc_reg", from = "./src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
torch = {url="https://download.pytorch.org/whl/cu118/torch-2.1.2%2Bcu118-cp39-cp39-linux_x86_64.whl"}
mlflow = "^2.15.0"
torchmetrics = "^1.4.0.post0"
torchinfo = "^1.8.0"
tqdm = "~4.64.0"
psutil = "^6.0.0"
pynvml = "^11.5.0"
lightning = "^2.3.3"
hydra-core = "^1.3.2"
hydra-optuna-sweeper = "^1.2.0"
hydra-joblib-launcher = "^1.2.0"
typer = "^0.12.3"
async-timeout = "^4.0.3"
scikit-learn = "~1.1.0"
numpy = "~1.23.0"
pandas = "^1.4.0"
isml_train = { path = "../../lib/isml_train", develop = true }
xgboost = "^2.1.1"
retry = "^0.9.2"
tomlkit = "^0.13.2"

[tool.poetry.group.interactive]
optional = true

[tool.poetry.group.interactive.dependencies]
ipykernel = "~6.16.0"
seaborn = "^0.12.2"
matplotlib = "^3.7.1"
plotly = "^5.14.1"
papermill = "^2.4.0"
nbconvert = "^7.16.4"
yellowbrick = "^1.5"
